[project]
name = "openentitlement-workspace"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
  "openentitlement",
  "openentitlement-postgres",
  "openentitlement-stripe",
]

[dependency-groups]
dev = ["pytest>=8", "psycopg[binary]>=3.2", "mypy>=1.11", "ruff>=0.6"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
openentitlement = { workspace = true }
openentitlement-postgres = { workspace = true }
openentitlement-stripe = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "conformance"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "B", "W"]
ignore = ["E501", "B008"]
