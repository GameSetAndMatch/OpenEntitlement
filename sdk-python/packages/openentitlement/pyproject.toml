[project]
name = "openentitlement-sdk"
version = "0.2.0"
description = "Vendor-neutral entitlements API: features, limits, plans, overrides, grants. Reference SDK for the OpenEntitlement spec."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []
keywords = ["entitlements", "plans", "limits", "quotas", "billing", "openfeature"]
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Typing :: Typed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openentitlement"]

[project.urls]
Homepage = "https://openentitlement.dev/docs/python/"
Repository = "https://github.com/GameSetAndMatch/OpenEntitlement"
Issues = "https://github.com/GameSetAndMatch/OpenEntitlement/issues"

[project.optional-dependencies]
authoring = ["pydantic>=2.12,<3"]
