[project]
name = "openentitlement-stripe"
version = "0.1.1"
description = "Stripe Entitlements adapter for OpenEntitlement (no Stripe SDK dependency)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["openentitlement-sdk==0.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openentitlement_stripe"]

[tool.deptry.package_module_name_map]
openentitlement-sdk = "openentitlement"
