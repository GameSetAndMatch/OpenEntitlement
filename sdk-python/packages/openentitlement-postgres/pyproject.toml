[project]
name = "openentitlement-postgres"
version = "0.1.1"
description = "Postgres provider and advisory lock for OpenEntitlement."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["openentitlement-sdk==0.1.1", "psycopg>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openentitlement_postgres"]

[tool.deptry.package_module_name_map]
openentitlement-sdk = "openentitlement"
