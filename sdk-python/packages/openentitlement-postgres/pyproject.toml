[project]
name = "openentitlement-postgres"
version = "0.1.0"
description = "Postgres provider and advisory lock for OpenEntitlement."
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["openentitlement==0.1.0", "psycopg>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openentitlement_postgres"]
