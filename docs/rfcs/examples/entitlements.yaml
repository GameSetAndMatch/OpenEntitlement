# entitlements.yaml: one file per self-hosted install (RFC-0001 §5).
# Contracts only: never definitions or defaults. Reconciled into the
# database at startup with source: file; entitlement writes are refused.
# Proposed shape; not read by any released package yet.

contracts:
  acme:                               # organizationId
    tier_variant: enterprise
    period: {start: 2027-01-29, end: 2028-01-28}   # both inclusive
    status: active
    source: {sales: ACME-001}
    terms:
      max_members_per_project: 50
      recording_minutes: 12000
