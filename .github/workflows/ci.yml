name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python (${{ matrix.python }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the supported minimum (ADR-0006).
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: oe, POSTGRES_USER: oe, POSTGRES_DB: oe }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OE_PG_DSN: postgresql://oe:oe@localhost:5432/oe
    defaults: { run: { working-directory: sdk-python } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --prefix ../sdk-js
      - run: npm ci --prefix ../console
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run pre-commit run uv-lock-check --all-files
      - run: uv run pre-commit run deptry --all-files
      - run: uv run ruff check packages scripts tests/test_catalog_contract.py
      - name: Committed Privilege Catalog JSON Schema matches the Pydantic models
        run: uv run python scripts/export_schemas.py --check
      # Includes tests/test_catalog_contract.py: shared fixtures against Pydantic and the JSON Schema.
      - run: uv run pytest -q

  typescript:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: oe, POSTGRES_USER: oe, POSTGRES_DB: oe }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OE_PG_DSN: postgresql://oe:oe@localhost:5432/oe
    defaults: { run: { working-directory: sdk-js } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm run typecheck
      # Includes test/catalog-contract.test.ts: shared fixtures against Zod, and Zod's
      # JSON Schema against the committed Pydantic-generated schema.
      - run: npm test
      - run: npm run build

  service:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: oe, POSTGRES_USER: oe, POSTGRES_DB: oe }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OE_PG_DSN: postgresql://oe:oe@localhost:5432/oe
    defaults: { run: { working-directory: console } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm ci --prefix ../sdk-js
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:setup
      - run: npm run test:workspaces
      - run: npm run build:storybook
      - run: npm run test:storybook

  website:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm run test:diagrams --workspace website
      - run: npx wrangler deploy --dry-run
