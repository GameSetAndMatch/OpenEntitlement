name: deploy website

# Builds openentitlement.dev from main and deploys it to the Cloudflare Worker named in wrangler.jsonc.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://openentitlement.dev
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable is not set; skipping deployment."
            echo "skipped=true" >> "$GITHUB_ENV"
            exit 0
          fi
          npx wrangler deploy --message "main ${GITHUB_SHA::7}"
      - name: Smoke-test the live site
        if: env.skipped != 'true'
        run: |
          for path in / /docs/ /docs/quickstart/; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://openentitlement.dev${path}?deploy=${GITHUB_SHA}")
            echo "${path} -> ${status}"
            test "$status" = 200
          done
