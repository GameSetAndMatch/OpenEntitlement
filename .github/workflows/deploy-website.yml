name: deploy website

# Builds openentitlement.dev from main and deploys it to the Cloudflare Worker named in wrangler.jsonc.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment:
      name: website
      url: https://openentitlement.dev
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Written into public/ so it survives every build, including the one
      # `wrangler deploy` runs itself from the `build` command in wrangler.jsonc.
      - name: Stamp the deployment revision
        run: |
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          writeFileSync('website/public/revision.json', JSON.stringify({ revision: process.env.GITHUB_SHA }) + '\n');
          JS
      - run: npm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Production deployment requires the website environment token and account configuration."
            exit 1
          fi
          npx wrangler deploy --message "main ${GITHUB_SHA::7}"
      - name: Smoke-test the live site
        run: |
          for path in / /docs/ /docs/quickstart/; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://openentitlement.dev${path}?deploy=${GITHUB_SHA}")
            echo "${path} -> ${status}"
            test "$status" = 200
          done
          curl --fail --silent --show-error --retry 3 --retry-delay 2 "https://openentitlement.dev/revision.json?deploy=${GITHUB_SHA}" -o /tmp/oe-deployed-revision.json
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const deployed = JSON.parse(readFileSync('/tmp/oe-deployed-revision.json', 'utf8'));
          if (deployed.revision !== process.env.GITHUB_SHA) throw new Error('Production revision does not match this deployment');
          JS
