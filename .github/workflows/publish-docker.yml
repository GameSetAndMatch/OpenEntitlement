name: Service container

on:
  pull_request:
    paths: ["console/**", "sdk-js/packages/core/**", "sdk-js/packages/postgres/**", "spec/assets/**", "Dockerfile", ".dockerignore", ".github/workflows/publish-docker.yml"]
  push:
    branches: [main]
    paths: ["console/**", "sdk-js/packages/core/**", "sdk-js/packages/postgres/**", "spec/assets/**", "Dockerfile", ".dockerignore", ".github/workflows/publish-docker.yml"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'service-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release source and version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node -e 'const p = require("./console/package.json"); if (process.env.RELEASE_TAG !== `service-v${p.version}`) process.exit(1)'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: openentitlement:test
      - name: Test console and entitlement evaluation
        run: |
          docker run -d --name oe-test -p 127.0.0.1:8787:8787 openentitlement:test
          trap 'docker logs oe-test; docker rm -f oe-test' EXIT
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:8787/ -o /tmp/oe-index.html
          grep -q '<html' /tmp/oe-index.html
          node --input-type=module - <<'JS'
          for (const [organizationId, expected] of [["hooli", 3], ["acme", 250]]) {
            const r = await fetch("http://127.0.0.1:8787/oerep/v1/resolve/seats.max", {
              method: "POST", headers: {"content-type": "application/json"},
              body: JSON.stringify({context: {organizationId}})
            });
            const body = await r.json();
            if (!r.ok || body.value !== expected) throw new Error(JSON.stringify(body));
          }
          JS

  publish:
    if: github.event_name == 'push' || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'service-v'))
    needs: test
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: olivierbelhumeur/openentitlement
          tags: |
            type=raw,value=edge,enable=${{ github.event_name == 'push' }}
            type=sha
            type=match,pattern=service-v(.*),group=1,enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
      - uses: docker/login-action@v4
        with:
          username: olivierbelhumeur
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
